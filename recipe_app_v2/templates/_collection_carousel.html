<section class="collection-carousel" aria-label="Filter by collection" x-data>
  <div class="collection-carousel-heading"><h2>Collections</h2><div class="carousel-arrows" x-cloak>
    <button type="button" aria-label="Scroll collections left" @click="$refs.collections.scrollBy({ left: -$refs.collections.clientWidth * 0.8, behavior: 'smooth' })">&#8592;</button>
    <button type="button" aria-label="Scroll collections right" @click="$refs.collections.scrollBy({ left: $refs.collections.clientWidth * 0.8, behavior: 'smooth' })">&#8594;</button>
  </div></div>
  <nav class="collection-track" x-ref="collections" aria-label="Collections">
    <a class="collection-tile" data-collection-id="0" href="{{ list_url(1, sort, q) }}" hx-get="/" hx-vals='{"collection_id":0}' hx-include="#search-query,#sort" hx-params="q,sort,collection_id" hx-target="#recipes" hx-swap="outerHTML" hx-push-url="true" hx-sync="#recipe-search:replace"{% if not collection_id %} aria-current="true"{% endif %}>
      <img class="collection-thumbnail" src="/recipe-images/{{ ((all_recipes_thumbnail.image_file if all_recipes_thumbnail else none) or 'default.jpg') | urlencode }}" alt=""{% if all_recipes_thumbnail %} title="{{ all_recipes_thumbnail.recipe_name }}" data-thumbnail-recipe-id="{{ all_recipes_thumbnail.thumbnail_recipe_id }}"{% endif %} loading="lazy"><span>All recipes</span>
    </a>
    {% for collection in collection_cards %}
    <a class="collection-tile" data-collection-id="{{ collection.collection_id }}" href="{{ list_url(1, sort, q, collection.collection_id) }}" hx-get="/" hx-vals='{"collection_id":{{ collection.collection_id }}}' hx-include="#search-query,#sort" hx-params="q,sort,collection_id" hx-target="#recipes" hx-swap="outerHTML" hx-push-url="true" hx-sync="#recipe-search:replace"{% if collection.collection_id == collection_id %} aria-current="true"{% endif %}>
      {% if collection.thumbnail_recipe_id %}<img class="collection-thumbnail" src="/recipe-images/{{ (collection.image_file or 'default.jpg') | urlencode }}" alt="" title="{{ collection.recipe_name }}" loading="lazy" data-thumbnail-recipe-id="{{ collection.thumbnail_recipe_id }}">
      {% else %}<span class="collection-thumbnail collection-placeholder" aria-hidden="true">Empty</span>{% endif %}
      <span>{{ collection.collection_name }}</span>
    </a>
    {% endfor %}
  </nav>
</section>
