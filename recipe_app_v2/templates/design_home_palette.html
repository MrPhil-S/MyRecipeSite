{# All values come from the fixed Python palette catalog. HTMX replaces this
   style with the preview so dialogs and focus rings inherit the same palette. #}
<style id="preview-palette">
  :root {
    --accent: {{ palette.accent }};
    --accent-hover: {{ palette.hover }};
    --quiet: {{ palette.quiet }};
    --rule: {{ palette.rule }};
  }
</style>
