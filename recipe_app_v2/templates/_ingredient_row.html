<div class="ingredient-row">
  <input type="hidden" name="ingredient_id" value="{{ row.id }}">
  <label>Name<input name="ingredient_name" maxlength="100" value="{{ row.name }}"></label>
  <label>Note<input name="ingredient_note" maxlength="100" value="{{ row.note }}"></label>
  <label>Type<select name="ingredient_group"><option value="0"{% if row.group == '0' %} selected{% endif %}>Ingredient</option><option value="1"{% if row.group == '1' %} selected{% endif %}>Group heading</option></select></label>
  <label>Action<select name="ingredient_keep"><option value="1"{% if row.keep == '1' %} selected{% endif %}>Keep</option><option value="0"{% if row.keep == '0' %} selected{% endif %}>Remove</option></select></label>
</div>
