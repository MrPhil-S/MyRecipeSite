<div class="ingredient-row">
  <button type="button" class="drag-handle" aria-label="Reorder ingredient" title="Drag to reorder; use arrow keys when focused">&#8942;&#8942;</button>
  <input type="hidden" name="ingredient_id" value="{{ row.id }}">
  <label>Name<input name="ingredient_name" maxlength="100" value="{{ row.name }}"></label>
  <label>Note<input name="ingredient_note" maxlength="100" value="{{ row.note }}"></label>
  <input type="hidden" name="ingredient_group" value="{{ row.group }}">
  <input type="hidden" name="ingredient_keep" value="1">
  <label class="ingredient-group-toggle"><input type="checkbox" data-group-toggle{% if row.group == '1' %} checked{% endif %}> Group heading</label>
  <button type="button" class="ingredient-remove" data-remove-ingredient aria-label="Remove ingredient row" title="Remove row">&#128465;</button>
</div>
