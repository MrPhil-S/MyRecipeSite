services:
  fastapi:
    build:
      context: .
      dockerfile: recipe_app_v2/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      RECIPE_DEV_DB_URI: ${RECIPE_DEV_DB_URI:-}
      RECIPE_DEV_WRITES: "1"
      RECIPE_UPLOADS: /app/recipe_uploads
    volumes:
      - recipe_uploads:/app/recipe_uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=20)"]
      interval: 30s
      timeout: 25s
      start_period: 15s
      retries: 3

volumes:
  recipe_uploads:
    name: myrecipesite_recipe_uploads
    external: true
